<?xml version="1.0" encoding="UTF-8"?>
<!-- Chinese share card (1200x630). Build with ./build.sh, which supplies
     cover.png (book/assets/cover-cn-v3.png) next to this file.
     The cover sits left of centre so a square centre crop (WeChat
     thumbnails, x 285-915) still shows the gopher. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <image x="170" y="70" width="374" height="490" xlink:href="cover.png" preserveAspectRatio="xMidYMid meet"/>

  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif">
    <text x="600" y="222" font-size="84" font-weight="600" fill="#1f1f1f">Go 语言原本</text>
    <text x="602" y="292" font-size="38" fill="#444444">一份不太简短的源码研究</text>
    <text x="602" y="356" font-size="30" fill="#555555">欧长坤 著 · 基于 Go 1.26</text>
  </g>
  <text x="602" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#007d9c">golang.design/under-the-hood</text>
</svg>

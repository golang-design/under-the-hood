baseURL = "https://golang.design/under-the-hood"
languageCode = "zh-cn"
title = "Go 语言原本"
theme = "book"

# The book has no tags or categories; do not render empty taxonomy pages.
disableKinds = ["taxonomy", "term"]

# Two languages. zh-cn is the default and owns content/ (generated by
# make-cn.go from book/zh-cn) and keeps its /zh-cn/ path segment as part of
# the content tree, so existing URLs stay unchanged; its pages carry
# `type: zh-cn`, which selects the layouts/zh-cn/* templates. en lives in the
# sibling content-en/ (generated from book/en-us) and is served under /en/.
# A third language needs its own non-overlapping contentDir, a
# [languages.<code>] block below and an i18n file under themes/book/i18n/; the
# header's language link reads Hugo's translations, so it needs no change.
defaultContentLanguage = "zh-cn"
# Keep the default language at the site root (no /<lang>/ prefix injected by
# Hugo) so existing links and the generated content/zh-cn/ tree keep resolving
# unchanged.
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh-cn]
    languageName = "中文"
    languageCode = "zh-cn"
    title = "Go 语言原本"
    contentDir = "content"
    weight = 1

  [languages.en]
    languageName = "English"
    languageCode = "en"
    title = "Go: Under the Hood"
    # A non-nested sibling of content/ (which zh-cn owns), so Hugo does not
    # reject overlapping content roots. Generated by make-cn.go from book/en-us.
    contentDir = "content-en"
    weight = 2
    [languages.en.params]
      # en content is flat at the root of content-en (the parts plus the
      # loose preface/how-to-read/... pages), so the sidebar is built from the
      # language home rather than a single named section. zh-cn keeps the
      # default ("zh-cn"). See partials/zh-cn/menu-filetree.html.
      BookSection = "*"
      # English share card and fallback description (the site-wide ones
      # under [params] are Chinese). See tools/og/build.sh.
      shareImage = "og-cover-en.png"
      description = "Go: Under the Hood is a study of Go 1.26's source: the design and evolution of the scheduler, memory allocator, garbage collector, compiler, and runtime."

[params]
  # Default share/SEO description used when a page has no front-matter
  # `description` and no body summary (home, section indexes). Per-page text
  # still wins. Consumed by partials/zh-cn/social-meta.html.
  description = "《Go 语言原本》是一份基于 Go 1.26 的源码研究，深入剖析调度器、内存分配、垃圾回收、编译器与运行时的设计与演化。"
  # 1200x630 card served at the site root; see tools/og/build.sh.
  shareImage = "og-cover.png"
  # Twitter/X @handle for card attribution. Left empty on purpose: a wrong
  # handle is worse than none. Set e.g. "@changkun" to enable twitter:site.
  twitter = ""
  # Browser-language auto-routing default (partials/zh-cn/lang-redirect.html):
  # non-Chinese browsers land on this language, WeChat/zh browsers on Chinese.
  autoLangDefault = "en"

[markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    # noClasses=false emits class-based token markup (.k/.s/.c/...) instead of
    # inlining the "vs" light-theme colors as style="" attributes. Inlined
    # colors cannot be overridden for dark mode without !important on every
    # token; with classes we ship a light Chroma palette as default and a dark
    # palette under html.dark (see assets/_custom.scss). `style` is intentionally
    # omitted because it only matters when noClasses=true.
    noClasses = false
    tabWidth = 4
[markup.goldmark.renderer]
    unsafe= true
# Pass LaTeX math through to the HTML so KaTeX can render it client-side.
# Same delimiters GitHub understands, so the .md stays readable there too.
[markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]

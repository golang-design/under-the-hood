<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">

<head>
  {{ partial "zh-cn/lang-redirect" . }}
  {{ partial "zh-cn/html-head" . }}
</head>

<body>
  {{ partial "zh-cn/topbar" . }}
  <main class="flex container">
    <aside class="book-menu fixed">
      {{ partial "zh-cn/menu" . }}
    </aside>

    <div class="book-page">
      {{ template "main" . }}
      {{ partial "zh-cn/inject/footer" . }}
    </div>

    {{ template "toc" . }}
  </main>
</body>

</html>
